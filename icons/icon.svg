<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- Graduation cap body -->
  <polygon points="256,120 420,195 256,270 92,195" fill="white" opacity="0.95"/>
  <!-- Cap top board -->
  <rect x="206" y="100" width="100" height="24" rx="12" fill="white" opacity="0.7"/>
  <!-- Diploma scroll on left side -->
  <rect x="120" y="270" width="64" height="80" rx="10" fill="white" opacity="0.8"/>
  <line x1="133" y1="295" x2="172" y2="295" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <line x1="133" y1="310" x2="172" y2="310" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <line x1="133" y1="325" x2="155" y2="325" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <!-- Star on right -->
  <polygon points="390,265 398,288 422,288 403,302 410,325 390,311 370,325 377,302 358,288 382,288" fill="#fbbf24" opacity="0.95"/>
  <!-- Band text area -->
  <rect x="148" y="375" width="216" height="54" rx="27" fill="white" opacity="0.2"/>
  <text x="256" y="411" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">IELTS 6.0</text>
</svg>
